version: 0.2

env:
  variables:
    CI: "false"
    PUBLIC_URL: "/"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm install

  build:
    commands:
      - echo "Building the app..."
      - npm run build

  post_build:
    commands:
      - echo "Deploying to S3 bucket: app.kazaswap.co"
      - aws s3 sync build/ s3://app.kazaswap.co/ --region eu-west-3 --delete
